[project]
name = "blackmamba-kodex"
version = "0.1.0"
description = "Local-first BlackMamba programming agent"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "openai>=1.12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0"
]

[project.scripts]
kodex = "kodex.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kodex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true
